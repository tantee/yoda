# No secrets here: deploy/registry credentials come from CI/CD variables.
stages: [secrets, test, build]

default:
  interruptible: true

secrets:
  stage: secrets
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: ['']
  variables:
    GIT_DEPTH: 0 # full history
  script:
    - gitleaks detect --source . --config .gitleaks.toml --redact --verbose

test:
  stage: test
  image: node:22-alpine
  services:
    - name: pgvector/pgvector:pg17
      alias: postgres
  variables:
    POSTGRES_USER: yoda # CI-only throwaway database
    POSTGRES_PASSWORD: yoda-ci
    POSTGRES_DB: yoda_test
    TEST_DATABASE_URL: postgres://yoda:yoda-ci@postgres:5432/yoda_test
    LEFTHOOK: '0'
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile --ignore-scripts
  script:
    - pnpm typecheck
    - pnpm test

.build:
  stage: build
  image: docker:27
  services: ['docker:27-dind']
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build-core:
  extends: .build
  script:
    - docker build -f apps/core/Dockerfile -t "$CI_REGISTRY_IMAGE/yoda-core:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/yoda-core:${CI_COMMIT_TAG:-latest}" .
    - docker push --all-tags "$CI_REGISTRY_IMAGE/yoda-core"

build-portal:
  extends: .build
  script:
    - docker build -f apps/portal/Dockerfile -t "$CI_REGISTRY_IMAGE/yoda-portal:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/yoda-portal:${CI_COMMIT_TAG:-latest}" .
    - docker push --all-tags "$CI_REGISTRY_IMAGE/yoda-portal"
