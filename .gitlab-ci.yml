# No secrets here: deploy/registry credentials come from CI/CD variables (docs/operations.md, "Upgrade").
stages: [secrets, test, build, release, deploy]

default:
  interruptible: true

secrets:
  stage: secrets
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: ['']
  variables:
    GIT_DEPTH: 0 # full history
  script:
    - gitleaks detect --source . --config .gitleaks.toml --redact --verbose

test:
  stage: test
  image: node:22-alpine
  services:
    - name: pgvector/pgvector:pg17
      alias: postgres
  variables:
    POSTGRES_USER: yoda # CI-only throwaway database
    POSTGRES_PASSWORD: yoda-ci
    POSTGRES_DB: yoda_test
    TEST_DATABASE_URL: postgres://yoda:yoda-ci@postgres:5432/yoda_test
    TEST_STORAGE: memory
    LEFTHOOK: '0'
  before_script:
    # bash runs the ops/backup script tests; util-linux brings flock for their lock test; curl, minisign and
    # shellcheck run the installer tests (ops-install.test.ts).
    - apk add --no-cache bash util-linux curl minisign shellcheck
    - corepack enable
    - pnpm install --frozen-lockfile --ignore-scripts
  script:
    - pnpm typecheck
    - pnpm test

.build:
  stage: build
  image: docker:27.5.1
  services: ['docker:27.5.1-dind']
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  # $CI_REGISTRY_IMAGE/<name>: the commit SHA always, the git tag on tags, `latest` on the default branch.
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_NAME"
    - docker build -f "$DOCKERFILE" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" "$CONTEXT"
    - if [ -n "$CI_COMMIT_TAG" ]; then docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$CI_COMMIT_TAG"; fi
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest"; fi
    - docker push --all-tags "$IMAGE"

build-core:
  extends: .build
  variables:
    IMAGE_NAME: core
    DOCKERFILE: apps/core/Dockerfile
    CONTEXT: .

build-portal:
  extends: .build
  variables:
    IMAGE_NAME: portal
    DOCKERFILE: apps/portal/Dockerfile
    CONTEXT: .

build-runner:
  extends: .build
  variables:
    IMAGE_NAME: runner
    DOCKERFILE: apps/runner/Dockerfile
    CONTEXT: .

build-backup:
  extends: .build
  variables:
    IMAGE_NAME: backup
    DOCKERFILE: ops/backup/Dockerfile
    CONTEXT: ops/backup

# Tags only: the release bundle install.sh downloads (docs/operations.md, "Release bundle"). Builds
# releases/<tag>/ with ops/install/bundle.sh (the compose files, deploy.sh, install.sh, SHA256SUMS), signs
# SHA256SUMS with minisign, keeps it as a job artifact and uploads it to the internal file server (D1).
# CI/CD variables (protected, for protected tags), none in this file:
# - YODA_RELEASE_SIGNING_KEY (type File): the minisign secret key, made without a password (minisign -G -W);
#   its public half is embedded in ops/install/install.sh;
# - YODA_RELEASE_UPLOAD_URL: the file server's base for releases (empty: the upload is skipped, the artifact stays);
# - YODA_RELEASE_UPLOAD_TOKEN (masked): sent as a bearer token on stdin, never on the command line.
# The upload is a template: one HTTP PUT per file to $YODA_RELEASE_UPLOAD_URL/releases/<tag>/<file>; change it to
# what the file server takes (WebDAV, the GitLab generic package registry, rsync over SSH, ...).
release-bundle:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG
  interruptible: false
  before_script:
    - case "$CI_COMMIT_TAG" in '' | -* | *[!A-Za-z0-9._-]*) echo "invalid release tag" >&2; exit 1 ;; esac
    - apk add --no-cache curl minisign tar git
    - test -s "$YODA_RELEASE_SIGNING_KEY" || { echo "YODA_RELEASE_SIGNING_KEY (a File variable) is not set" >&2; exit 1; }
  script:
    # Reproducible: every mtime is the tagged commit's time (GNU tar, gzip -n).
    - export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
    - sh ops/install/bundle.sh "$CI_COMMIT_TAG" "$CI_REGISTRY_IMAGE" dist
    - minisign -S -s "$YODA_RELEASE_SIGNING_KEY" -m "dist/releases/$CI_COMMIT_TAG/SHA256SUMS" -t "yoda release $CI_COMMIT_TAG"
    # Self-check against the public key install.sh embeds: a placeholder or a mismatched key fails the release.
    - pub=$(sed -n "s/^RELEASE_PUBKEY_EMBEDDED='\\(.*\\)'$/\\1/p" ops/install/install.sh)
    - minisign -V -P "$pub" -m "dist/releases/$CI_COMMIT_TAG/SHA256SUMS"
    - |
      if [ -z "${YODA_RELEASE_UPLOAD_URL:-}" ]; then
        echo "YODA_RELEASE_UPLOAD_URL is not set: the bundle stays a job artifact only"
        exit 0
      fi
      # The token goes into a curl config line: refuse an empty one, or one with quotes, spaces or newlines.
      if [ -z "$YODA_RELEASE_UPLOAD_TOKEN" ] || printf '%s' "$YODA_RELEASE_UPLOAD_TOKEN" | tr -d 'A-Za-z0-9._~+/=-' | grep -q .; then
        echo "YODA_RELEASE_UPLOAD_TOKEN is empty or holds characters a bearer token cannot" >&2
        exit 1
      fi
      for f in "dist/releases/$CI_COMMIT_TAG"/*; do
        printf 'header = "Authorization: Bearer %s"\n' "$YODA_RELEASE_UPLOAD_TOKEN" |
          curl -fsS --retry 3 -K - --upload-file "$f" "${YODA_RELEASE_UPLOAD_URL%/}/releases/$CI_COMMIT_TAG/$(basename "$f")"
      done
  artifacts:
    paths: [dist/releases/]
    expire_in: 90 days

# Manual, tags only. CI/CD variables (protected, for protected tags): DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH,
# DEPLOY_SSH_KEY (type File) and DEPLOY_KNOWN_HOSTS (the host's `ssh-keyscan` lines, checked by hand once).
# Copies the tag's compose files and deploy script to $DEPLOY_PATH, then runs ops/deploy/deploy.sh there:
# pull, pin the tag in release.env, migrate once, up -d, wait for /ready. Roll back by running this job on the previous tag's pipeline.
deploy:
  stage: deploy
  image: alpine:3.20
  # The images, not the release bundle: a bundle that failed to sign or upload never blocks a deploy.
  needs: [build-core, build-portal, build-runner, build-backup]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  resource_group: production
  interruptible: false
  environment:
    name: production
  before_script:
    # The tag goes into the remote command line: plain release names only.
    - case "$CI_COMMIT_TAG" in '' | -* | *[!A-Za-z0-9._-]*) echo "invalid release tag" >&2; exit 1 ;; esac
    - apk add --no-cache openssh-client tar
    - chmod 600 "$DEPLOY_SSH_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    # A failed tar must fail the job, not ship a partial archive.
    - set -o pipefail
    # The runbook, .env.example and the changelog too, so the host's copies match the release it runs (never .env).
    - tar -cf - docker-compose.yml docker-compose.prod.yml ops/deploy/deploy.sh docs/operations.md .env.example CHANGELOG.md
      | ssh -i "$DEPLOY_SSH_KEY" -o StrictHostKeyChecking=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST"
      "mkdir -p '$DEPLOY_PATH' && tar -xf - -C '$DEPLOY_PATH'"
    - ssh -i "$DEPLOY_SSH_KEY" -o StrictHostKeyChecking=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST"
      "cd '$DEPLOY_PATH' && YODA_VERSION='$CI_COMMIT_TAG' sh ops/deploy/deploy.sh"
