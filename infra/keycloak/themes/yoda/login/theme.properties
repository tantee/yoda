# Yoda login theme (docs/design/portal-design-refresh.md §7.3). An original theme on top of Keycloak's `base`
# login theme: our own page layout (template.ftl), CSS and self-hosted fonts. Every other page (password reset,
# OTP, errors, ...) comes from `base` and picks up the class names below.
parent=base
locales=th,en

meta=viewport==width=device-width,initial-scale=1
styles=css/fonts.css css/yoda.css

# Page
kcHtmlClass=yoda-html
kcBodyClass=yoda-body
kcLoginClass=yoda-login
kcHeaderClass=yoda-brand
kcHeaderWrapperClass=yoda-brand__inner
kcFormCardClass=yoda-card
kcFormHeaderClass=yoda-card__head
kcContentWrapperClass=yoda-row
kcSignUpClass=yoda-info
kcInfoAreaWrapperClass=yoda-info__inner

# Language links
kcLocaleMainClass=yoda-locale
kcLocaleWrapperClass=yoda-locale__inner
kcLocaleListClass=yoda-locale__list
kcLocaleListItemClass=yoda-locale__item
kcLocaleItemClass=yoda-locale__link

# Messages
kcAlertClass=yoda-alert
kcAlertTitleClass=yoda-alert__text
kcFeedbackErrorIcon=yoda-icon yoda-icon--error
kcFeedbackWarningIcon=yoda-icon yoda-icon--warning
kcFeedbackSuccessIcon=yoda-icon yoda-icon--success
kcFeedbackInfoIcon=yoda-icon yoda-icon--info
kcResetFlowIcon=yoda-icon yoda-icon--restart

# Forms
kcFormClass=yoda-form
kcFormGroupClass=yoda-field
kcFormGroupErrorClass=yoda-field--error
kcFormGroupHeader=yoda-field-group
kcLabelClass=yoda-label
kcLabelWrapperClass=yoda-label-wrap
kcInputClass=yoda-input
kcInputWrapperClass=yoda-input-wrap
kcInputGroup=yoda-input-group
kcInputErrorMessageClass=yoda-field__error
kcInputHelperTextBeforeClass=yoda-field__help
kcInputHelperTextAfterClass=yoda-field__help
kcInputClassRadio=yoda-choice
kcInputClassRadioInput=yoda-choice__input
kcInputClassRadioLabel=yoda-choice__label
kcInputClassCheckbox=yoda-choice
kcInputClassCheckboxInput=yoda-choice__input
kcInputClassCheckboxLabel=yoda-choice__label
kcInputClassRadioCheckboxLabelDisabled=yoda-choice--disabled
kcTextareaClass=yoda-input
kcFormSettingClass=yoda-options
kcFormOptionsClass=yoda-options__start
kcFormOptionsWrapperClass=yoda-options__end
kcFormButtonsClass=yoda-buttons
kcFormButtonsWrapperClass=yoda-buttons__inner
kcCheckClass=yoda-choice
kcCheckInputClass=yoda-choice__input
kcCheckLabelClass=yoda-choice__label
kcSrOnlyClass=yoda-sr-only

# Buttons
kcButtonClass=yoda-btn
kcButtonPrimaryClass=yoda-btn--primary
kcButtonDefaultClass=yoda-btn--default
kcButtonLargeClass=yoda-btn--large
kcButtonBlockClass=yoda-btn--block
kcInputLargeClass=yoda-input--large

# Password visibility (base's passwordVisibility.js swaps these classes)
kcFormPasswordVisibilityButtonClass=yoda-btn yoda-btn--icon
kcFormPasswordVisibilityIconShow=yoda-icon yoda-icon--eye
kcFormPasswordVisibilityIconHide=yoda-icon yoda-icon--eye-off

# Identity providers, if a realm adds any
kcFormSocialAccountSectionClass=yoda-idp
kcFormSocialAccountListClass=yoda-idp__list
kcFormSocialAccountListGridClass=yoda-idp__list--grid
kcFormSocialAccountListButtonClass=yoda-btn yoda-btn--default yoda-btn--block
kcFormSocialAccountGridItem=yoda-idp__item
kcFormSocialAccountNameClass=yoda-idp__name
kcCommonLogoIdP=yoda-idp__logo

# Other sign-in methods (OTP, WebAuthn, recovery codes)
kcSelectAuthListClass=yoda-auth-list
kcSelectAuthListItemClass=yoda-auth-item
kcSelectAuthListItemIconClass=yoda-auth-item__icon
kcSelectAuthListItemIconPropertyClass=yoda-icon
kcSelectAuthListItemBodyClass=yoda-auth-item__body
kcSelectAuthListItemHeadingClass=yoda-auth-item__title
kcSelectAuthListItemDescriptionClass=yoda-auth-item__text
kcSelectAuthListItemFillClass=yoda-auth-item__fill
kcSelectAuthListItemArrowClass=yoda-auth-item__arrow
kcSelectAuthListItemArrowIconClass=yoda-icon yoda-icon--chevron
kcSelectAuthListItemTitle=yoda-auth-item__para
kcAuthenticatorDefaultClass=yoda-icon yoda-icon--key
kcAuthenticatorPasswordClass=yoda-icon yoda-icon--key
kcAuthenticatorOTPClass=yoda-icon yoda-icon--phone
kcAuthenticatorWebAuthnClass=yoda-icon yoda-icon--key
kcAuthenticatorWebAuthnPasswordlessClass=yoda-icon yoda-icon--key
kcWebAuthnKeyIcon=yoda-icon yoda-icon--key
kcWebAuthnDefaultIcon=yoda-icon yoda-icon--key
kcWebAuthnUnknownIcon=yoda-icon yoda-icon--key
kcWebAuthnUSB=yoda-icon yoda-icon--key
kcWebAuthnNFC=yoda-icon yoda-icon--key
kcWebAuthnBLE=yoda-icon yoda-icon--key
kcWebAuthnInternal=yoda-icon yoda-icon--key
kcLoginOTPListClass=yoda-otp
kcLoginOTPListInputClass=yoda-otp__input
kcLoginOTPListItemHeaderClass=yoda-otp__head
kcLoginOTPListItemIconBodyClass=yoda-otp__icon
kcLoginOTPListItemIconClass=yoda-icon yoda-icon--phone
kcLoginOTPListItemTitleClass=yoda-otp__title
kcRecoveryCodesWarning=yoda-alert
kcRecoveryCodesList=yoda-codes
kcRecoveryCodesActions=yoda-buttons
kcRecoveryCodesConfirmation=yoda-choice
