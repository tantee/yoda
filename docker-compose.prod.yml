# Overlay over docker-compose.yml. All values come from the environment (the host's .env and release.env, or
# your shell). No secrets here.
# Images: ${YODA_IMAGE_PREFIX}/<name>:${YODA_VERSION}. Both are required (no default, so a missing prefix never
# pulls a `yoda/...` image from Docker Hub): a deploy host pulls that release from the registry, and
# ops/deploy/deploy.sh pins both in release.env (docs/operations.md). With YODA_<NAME>_DIGEST set (deploy.sh pins
# the signed bundle's digests there) the image is <prefix>/<name>:<version>@<digest>: Docker pulls and runs that
# digest, whatever the tag points to. Locally, build and run a prod-like stack
# under yoda/<name>:latest with:
#   YODA_IMAGE_PREFIX=yoda YODA_VERSION=latest docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# Core and the portal publish on 127.0.0.1 by default (a reverse proxy goes in front); Postgres and RustFS
# publish nothing (reach them with `docker compose exec`).
# Nothing but YODA_IMAGE_PREFIX and YODA_VERSION is required: the one-shot `init` service generates the Postgres password, the RustFS
# keys and the master key into the `yoda-bootstrap` volume (docs/design/installer-proposal.md §3.2). A value set
# in .env wins and is copied into the volume, so an existing .env install upgrades unchanged.
# Volume layout: shared files 0640 root:10500 (every reader gets `group_add: ['10500']`, postgres reads as root);
# core/ (0700, the core image's node user) holds the master key.
services:
  init:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    image: ${YODA_IMAGE_PREFIX:?YODA_IMAGE_PREFIX is required (the registry path; see release.env)}/core:${YODA_VERSION:?YODA_VERSION is required (see release.env)}${YODA_CORE_DIGEST:+@${YODA_CORE_DIGEST}}
    command: ['node', 'dist/init.js']
    # Root: it sets the owners (root:10500, core/ for the node user) and reads the Postgres data directory.
    user: '0:0'
    environment:
      # Every one optional: set only to override generation (or to keep an existing install's values).
      POSTGRES_USER: ${POSTGRES_USER:-yoda}
      POSTGRES_DB: ${POSTGRES_DB:-yoda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      YODA_MASTER_KEY: ${YODA_MASTER_KEY:-}
    volumes:
      - yoda-bootstrap:/var/lib/yoda
      # Read-only, only to refuse when a database exists but its password is unknown (§3.3).
      - pgdata:/probe/pgdata:ro
    restart: 'no'

  # Runs the database migrations once, before core starts; the only container that migrates in production.
  migrate:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    image: ${YODA_IMAGE_PREFIX:?YODA_IMAGE_PREFIX is required (the registry path; see release.env)}/core:${YODA_VERSION:?YODA_VERSION is required (see release.env)}${YODA_CORE_DIGEST:+@${YODA_CORE_DIGEST}}
    command: ['node', 'dist/migrate.js']
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    group_add: ['10500']
    environment:
      # Empty: derived from the bootstrap volume (an external Postgres sets it).
      DATABASE_URL: ${DATABASE_URL:-}
      YODA_BOOTSTRAP_FILE: /var/lib/yoda/bootstrap.env
    volumes:
      - yoda-bootstrap:/var/lib/yoda:ro
    restart: 'no'

  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    image: ${YODA_IMAGE_PREFIX:?YODA_IMAGE_PREFIX is required (the registry path; see release.env)}/core:${YODA_VERSION:?YODA_VERSION is required (see release.env)}${YODA_CORE_DIGEST:+@${YODA_CORE_DIGEST}}
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - '${CORE_BIND:-127.0.0.1}:${CORE_PORT:-4000}:4000'
    group_add: ['10500']
    # Read-write: core writes the setup token into its own core/ directory.
    volumes:
      - yoda-bootstrap:/var/lib/yoda
    environment:
      # Every setting the UI can edit is passed with an empty default: empty counts as unset, so it is editable in System
      # settings (and at /recovery) unless .env sets it. Only bootstrap-only values (§8) have a default or a fixed
      # value here (a core test checks this).
      PORT: 4000
      # Empty: derived from the bootstrap volume (an external Postgres sets it).
      DATABASE_URL: ${DATABASE_URL:-}
      YODA_BOOTSTRAP_FILE: /var/lib/yoda/bootstrap.env
      YODA_MASTER_KEY_FILE: /var/lib/yoda/core/master-key
      YODA_SETTINGS_IMPORT: ${YODA_SETTINGS_IMPORT:-}
      # 2 when the built-in proxy is on, unless .env sets it: deploy.sh pins YODA_PROXY_ENABLED in release.env, `true`
      # with the proxy profile and empty without, and refuses any other value in .env or its environment.
      YODA_TRUSTED_PROXY_HOPS: ${YODA_TRUSTED_PROXY_HOPS:-${YODA_PROXY_ENABLED:+2}}
      # The built-in proxy, for the setup wizard's read-only status card (core reads only the certificate the proxy
      # presents to anyone, never its files).
      YODA_PROXY_ENABLED: ${YODA_PROXY_ENABLED:-}
      YODA_PROXY_DOMAIN: ${YODA_PROXY_DOMAIN:-}
      YODA_PROXY_CERT_MODE: ${YODA_PROXY_CERT_MODE:-}
      YODA_PROXY_HTTPS_PORT: ${YODA_PROXY_HTTPS_PORT:-}
      # Optional: unset until sign-in is set up (setup mode refuses every token with `not_configured`).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      # Optional: fetch signing keys from an internal address; tokens are still checked against OIDC_ISSUER.
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      # The `migrate` service has already run; core never migrates in production.
      MIGRATE_ON_START: 'false'
      STAFF_GROUP: ${STAFF_GROUP:-}
      BOOTSTRAP_ADMINS: ${BOOTSTRAP_ADMINS:-}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-yoda}
      # Empty: from the bootstrap volume (an external S3 sets them).
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_MODEL_DRAFT: ${AI_MODEL_DRAFT:-}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_WORKERS: ${AI_WORKERS:-}
      DAILY_TASK_CAP: ${DAILY_TASK_CAP:-}
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      PORTAL_URL: ${PORTAL_URL:-}
      RUNNER_LEASE_SECONDS: ${RUNNER_LEASE_SECONDS:-}
      MCP_ENABLED: ${MCP_ENABLED:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_API_URL: ${LINE_API_URL:-https://api.line.me}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      # The portal settings core serves on /public-config (env locks them in the UI), and the deprecated Keycloak
      # overrides, which core checks against OIDC_ISSUER at boot (a mismatch is logged loudly, §6.4).
      NUXT_PUBLIC_ORG_LINE: ${NUXT_PUBLIC_ORG_LINE:-}
      NUXT_PUBLIC_RUNNER_DOCS_URL: ${NUXT_PUBLIC_RUNNER_DOCS_URL:-}
      NUXT_PUBLIC_LINE_ADD_FRIEND_URL: ${NUXT_PUBLIC_LINE_ADD_FRIEND_URL:-}
      NUXT_PUBLIC_KEYCLOAK_URL: ${NUXT_PUBLIC_KEYCLOAK_URL:-}
      NUXT_PUBLIC_KEYCLOAK_REALM: ${NUXT_PUBLIC_KEYCLOAK_REALM:-}
      NUXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NUXT_PUBLIC_KEYCLOAK_CLIENT_ID:-}
      # The backup container's settings, so a value set in .env shows locked in System settings → Backups.
      BACKUP_AT: ${BACKUP_AT:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-}
    # Ready = database, storage and job queue all answer (GET /ready).
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Replaces the dev credentials with the bootstrap volume's keys (the same ones core and backup use; RustFS reads
  # *_FILE natively and refuses both forms, so the base file's plain variables are removed, not blanked). No
  # published ports and no web console in production (`!reset` needs Compose v2.24+).
  rustfs:
    ports: !reset []
    depends_on:
      init:
        condition: service_completed_successfully
    group_add: ['10500']
    environment:
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_ACCESS_KEY: !reset null
      RUSTFS_SECRET_KEY: !reset null
      RUSTFS_ACCESS_KEY_FILE: /var/lib/yoda/s3-access-key
      RUSTFS_SECRET_KEY_FILE: /var/lib/yoda/s3-secret-key
    volumes:
      - yoda-bootstrap:/var/lib/yoda:ro
    restart: unless-stopped

  # Production credentials replace the dev ones (the base file's healthcheck hard-codes the dev user): the password
  # is the bootstrap volume's (the image refuses POSTGRES_PASSWORD and _FILE together, so the plain one is
  # removed). It reads the file as root, so no group_add. No published port, and no dev init.sql (a test database).
  postgres:
    ports: !reset []
    depends_on:
      init:
        condition: service_completed_successfully
    volumes: !override
      - pgdata:/var/lib/postgresql/data
      - yoda-bootstrap:/var/lib/yoda:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yoda}
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /var/lib/yoda/postgres-password
      POSTGRES_DB: ${POSTGRES_DB:-yoda}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
    restart: unless-stopped

  # The dev Keycloak and mail catcher never run in production (a profile nobody enables); production signs in
  # against the organisation's Keycloak at OIDC_ISSUER.
  keycloak:
    profiles: [dev-only]

  mailpit:
    profiles: [dev-only]

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    image: ${YODA_IMAGE_PREFIX:?YODA_IMAGE_PREFIX is required (the registry path; see release.env)}/portal:${YODA_VERSION:?YODA_VERSION is required (see release.env)}${YODA_PORTAL_DIGEST:+@${YODA_PORTAL_DIGEST}}
    depends_on:
      core:
        condition: service_healthy
    ports:
      - '${PORTAL_BIND:-127.0.0.1}:${PORTAL_PORT:-3000}:3000'
    environment:
      NUXT_CORE_URL: http://core:4000
      # With 1 (no reverse proxy in front) the portal sends core its own scheme and host, never the browser's; 2
      # with the built-in proxy, as for core.
      YODA_TRUSTED_PROXY_HOPS: ${YODA_TRUSTED_PROXY_HOPS:-${YODA_PROXY_ENABLED:+2}}
      # Deprecated overrides: the portal reads sign-in, the org line and its links from core's /public-config
      # (derived from OIDC_ISSUER / OIDC_CLIENT_ID and the settings); a non-empty value here still wins.
      NUXT_PUBLIC_KEYCLOAK_URL: ${NUXT_PUBLIC_KEYCLOAK_URL:-}
      NUXT_PUBLIC_KEYCLOAK_REALM: ${NUXT_PUBLIC_KEYCLOAK_REALM:-}
      NUXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NUXT_PUBLIC_KEYCLOAK_CLIENT_ID:-}
      NUXT_PUBLIC_LINE_ADD_FRIEND_URL: ${NUXT_PUBLIC_LINE_ADD_FRIEND_URL:-}
      NUXT_PUBLIC_RUNNER_DOCS_URL: ${NUXT_PUBLIC_RUNNER_DOCS_URL:-}
      NUXT_PUBLIC_ORG_LINE: ${NUXT_PUBLIC_ORG_LINE:-}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Optional built-in HTTPS proxy (docs/operations.md, section 4b): off unless the `proxy` profile is on
  # (COMPOSE_PROFILES=proxy in .env; `install.sh --with-proxy` writes it). Caddy, pinned by version and digest (a
  # bump: docs/releasing.md, "Pinned build inputs"), with ops/proxy/Caddyfile from the release bundle. It publishes
  # 80 and 443 (http is redirected) and forwards everything to the portal over the compose network, so the portal
  # and core stay on 127.0.0.1. Certificates: YODA_PROXY_CERT_MODE internal (Caddy's CA; deploy.sh copies its
  # public root to proxy/root.crt), files (proxy/certs/cert.pem and key.pem) or acme (Let's Encrypt).
  proxy:
    profiles: [proxy]
    image: caddy:2.11.4@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    depends_on:
      - portal
    ports:
      - '${YODA_PROXY_BIND:-0.0.0.0}:${YODA_PROXY_HTTP_PORT:-80}:${YODA_PROXY_HTTP_PORT:-80}'
      - '${YODA_PROXY_BIND:-0.0.0.0}:${YODA_PROXY_HTTPS_PORT:-443}:${YODA_PROXY_HTTPS_PORT:-443}'
    environment:
      YODA_PROXY_DOMAIN: ${YODA_PROXY_DOMAIN:-}
      YODA_PROXY_CERT_MODE: ${YODA_PROXY_CERT_MODE:-internal}
      YODA_PROXY_ACME_EMAIL: ${YODA_PROXY_ACME_EMAIL:-}
      # acme only: the ACME directory, Let's Encrypt's production one unless .env sets another (install.sh
      # --acme-staging: staging). The default is here, not in the Caddyfile: Caddy's {$VAR:default} ignores its
      # default for a variable that is set but empty, as compose passes it.
      YODA_PROXY_ACME_CA: ${YODA_PROXY_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      YODA_PROXY_HTTP_PORT: ${YODA_PROXY_HTTP_PORT:-80}
      YODA_PROXY_HTTPS_PORT: ${YODA_PROXY_HTTPS_PORT:-443}
    # The Caddyfile from the mounted directory: unpacking a bundle replaces the file (a new inode), which a
    # single-file mount would hide from the running container; the directory shows it, and deploy.sh reloads it.
    command: ['caddy', 'run', '--config', '/etc/caddy/yoda/Caddyfile', '--adapter', 'caddyfile']
    volumes:
      - ./ops/proxy:/etc/caddy/yoda:ro
      # files mode: the organisation's certificate and key (install.sh --cert/--key copies them here).
      - ./proxy/certs:/etc/caddy/certs:ro
      # Optional further sites (*.caddy), e.g. core's /mcp for the staff runners (section 8).
      - ./proxy/sites:/etc/caddy/sites:ro
      # The certificates Caddy holds, its internal CA (root key included) and the ACME account: keep it (back it
      # up as section 4b says, off this host like the recovery kit). Never mounted anywhere else.
      - proxy-data:/data
      - proxy-config:/config
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # It faces the network: no capabilities but binding 80 and 443 and reading proxy/certs/key.pem (0600, owned by
    # the deploy user, read as root here: DAC_OVERRIDE, in Docker's default set, confined to the container's own
    # mounts; never DAC_READ_SEARCH, which reopens open_by_handle_at, the "shocker" escape to host files), no
    # privilege gain, and a read-only root file system (it writes only its two volumes and /tmp).
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, DAC_OVERRIDE]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  # Daily backups (ops/backup): at the backup time in TZ a pg_dump -Fc of the database and a mirror of the bucket
  # go into the `backups` volume, kept for the days set (System settings → Backups, or BACKUP_AT and
  # BACKUP_KEEP_DAYS). One-shot: `run --rm backup --now`. Restore (core and portal stopped):
  # `run --rm -e RESTORE_CONFIRM=yes --entrypoint restore.sh backup <stamp|latest>`.
  backup:
    build:
      context: ops/backup
    image: ${YODA_IMAGE_PREFIX:?YODA_IMAGE_PREFIX is required (the registry path; see release.env)}/backup:${YODA_VERSION:?YODA_VERSION is required (see release.env)}${YODA_BACKUP_DIGEST:+@${YODA_BACKUP_DIGEST}}
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    group_add: ['10500']
    environment:
      # Empty: from the bootstrap volume's bootstrap.env (env wins).
      DATABASE_URL: ${DATABASE_URL:-}
      YODA_BOOTSTRAP_FILE: /var/lib/yoda/bootstrap.env
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-yoda}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # Empty: System settings → Backups (read from the database every minute), else 02:00 and 14 days. Set,
      # they win and show locked there.
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-}
      BACKUP_AT: ${BACKUP_AT:-}
      TZ: Asia/Bangkok
    volumes:
      - backups:/backups
      # Not copied into the backups (§3.6): keep the recovery kit with the backups, but not in the same place.
      - yoda-bootstrap:/var/lib/yoda:ro
    restart: unless-stopped

  # Optional server runner (README "Runners"): docker compose ... --profile runner up -d runner
  # The runner token, model key and git credentials come from the deploy environment only.
  runner:
    profiles: [runner]
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    image: ${YODA_IMAGE_PREFIX:?YODA_IMAGE_PREFIX is required (the registry path; see release.env)}/runner:${YODA_VERSION:?YODA_VERSION is required (see release.env)}${YODA_RUNNER_DIGEST:+@${YODA_RUNNER_DIGEST}}
    depends_on:
      - core
    environment:
      YODA_CORE_URL: ${YODA_RUNNER_CORE_URL:-http://core:4000}
      YODA_RUNNER_TOKEN: ${YODA_RUNNER_TOKEN:-} # required: the runner exits with a config error without it
      ANTHROPIC_API_KEY: ${YODA_RUNNER_ANTHROPIC_API_KEY:-}
      YODA_GIT_USERNAME: ${YODA_GIT_USERNAME:-oauth2}
      YODA_GIT_PASSWORD: ${YODA_GIT_PASSWORD:-}
      GIT_AUTHOR_NAME: ${YODA_RUNNER_GIT_NAME:-Yoda runner}
      GIT_AUTHOR_EMAIL: ${YODA_RUNNER_GIT_EMAIL:-yoda-runner@example.invalid}
      GIT_COMMITTER_NAME: ${YODA_RUNNER_GIT_NAME:-Yoda runner}
      GIT_COMMITTER_EMAIL: ${YODA_RUNNER_GIT_EMAIL:-yoda-runner@example.invalid}
    volumes:
      - ${YODA_RUNNER_CONFIG_FILE:-./runner-config.json}:/home/node/.config/yoda-runner/config.json:ro
      - runner-work:/home/node/.local/share/yoda-runner
    restart: unless-stopped

volumes:
  runner-work:
  backups:
  # The built-in proxy's certificates and internal CA (section 4b); created only when the profile is on.
  proxy-data:
  proxy-config:
  # The bootstrap values (init): never delete it; restoring on a new host needs the master key (recovery kit).
  yoda-bootstrap:
