# Publishes a Yoda release on GitHub (docs/releasing.md): the images on ghcr.io/<owner>/yoda/<name> and the signed
# release bundle as the GitHub Release's assets, the files install.sh downloads by default.
#
# - A `v<version>` tag (e.g. v1.0.0, v1.1.0-rc.1) is a real release: images for linux/amd64 and linux/arm64,
#   tagged <version> (no `v`, the YODA_VERSION a host pins) and sha-<short sha>; the bundle signed with the
#   MINISIGN_SECRET_KEY secret (the job fails without it) and checked against the public key embedded in
#   install.sh; then the GitHub Release with the CHANGELOG.md section of that version as its notes.
# - A pull request touching the release files, or a manual run, is a dry run: the same builds for linux/amd64
#   only, nothing pushed, the bundle signed with a throwaway key made in the job (never stored or uploaded), and
#   install.sh verifying it end to end against a local HTTP server.
#
# Images are pushed only after the bundle is signed and verified, so a tag that cannot be signed publishes nothing.
# An internal mirror (the GitLab pipeline, .gitlab-ci.yml) stays possible: install.sh --base-url / --image-prefix.
# Actions are pinned by full commit SHA (the comment names the release); bump them deliberately.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - ops/install/**
      - ops/deploy/**
      - ops/backup/**
      - apps/*/Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker-compose.prod.yml
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build and sign with a throwaway key, publish nothing). Off only on a v* tag.
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      real: ${{ steps.meta.outputs.real }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      prefix: ${{ steps.meta.outputs.prefix }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      platforms: ${{ steps.meta.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        name: release or dry run
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          real=false
          if [ "$EVENT" = push ] || { [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN" = false ]; }; then
            case "$REF" in
              refs/tags/v*) ;;
              *) echo "::error::A real release runs on a v<version> tag only (got $REF)."; exit 1 ;;
            esac
            real=true
            version=${REF#refs/tags/v}
          else
            version="0.0.0-dryrun.$RUN_NUMBER"
          fi
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' ||
            { echo "::error::Not a release version: $version (tags are v<x.y.z>, e.g. v1.0.0 or v1.1.0-rc.1)."; exit 1; }
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          if [ "$real" = true ]; then
            sh ops/install/release-notes.sh "$version" > /dev/null ||
              { echo "::error::CHANGELOG.md has no \"## $version\" section: add the release notes, commit, and tag again."; exit 1; }
            pkg=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)
            [ "$pkg" = "$version" ] || echo "::warning::package.json says version $pkg, the tag says $version."
            platforms=linux/amd64,linux/arm64
          else
            # Exercise the notes extraction on the newest released section.
            latest=$(sed -n 's/^## \([0-9][0-9A-Za-z.-]*\).*$/\1/p' CHANGELOG.md | head -n 1)
            sh ops/install/release-notes.sh "$latest" > /dev/null
            platforms=linux/amd64,linux/arm64 # TEMPORARY: measure the QEMU build time
          fi
          {
            echo "real=$real"
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
            echo "prefix=ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
            echo "sha_tag=sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            echo "platforms=$platforms"
          } | tee -a "$GITHUB_OUTPUT"

  bundle:
    needs: meta
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE_PREFIX: ${{ needs.meta.outputs.prefix }}
      DIST: dist/releases/${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: build the bundle
        run: |
          set -eu
          # Reproducible: every mtime is the commit's time (GNU tar, gzip -n).
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          sh ops/install/bundle.sh "$VERSION" "$IMAGE_PREFIX" dist
      - name: sign SHA256SUMS with the release key
        if: needs.meta.outputs.real == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::The repository secret MINISIGN_SECRET_KEY is not set, and a release is never published unsigned. Set it with: gh secret set MINISIGN_SECRET_KEY < yoda.key, and gh secret set MINISIGN_PASSWORD (docs/releasing.md)."
            exit 1
          fi
          key="$RUNNER_TEMP/yoda.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          printf '%s\n' "${MINISIGN_PASSWORD:-}" | minisign -S -s "$key" -m "$DIST/SHA256SUMS" -t "yoda release $VERSION" ||
            { echo "::error::minisign could not sign with MINISIGN_SECRET_KEY: check the key and MINISIGN_PASSWORD (docs/releasing.md)."; exit 1; }
      - name: check the release key against install.sh
        if: needs.meta.outputs.real == 'true'
        run: |
          set -eu
          pub=$(sed -n "s/^RELEASE_PUBKEY_EMBEDDED='\(.*\)'$/\1/p" ops/install/install.sh)
          case "$pub" in
            '' | *REPLACE-WITH*)
              echo "::error::ops/install/install.sh still embeds the placeholder public key. Put the second line of yoda.pub (it starts RW) into RELEASE_PUBKEY_EMBEDDED and the README verification snippet, commit, delete this tag and tag again (docs/releasing.md)."
              exit 1
              ;;
          esac
          minisign -V -q -P "$pub" -m "$DIST/SHA256SUMS" ||
            { echo "::error::The public key embedded in ops/install/install.sh does not match MINISIGN_SECRET_KEY: install.sh would refuse this release. Embed the public half of the signing key (yoda.pub, second line), or set the secret to the matching yoda.key (docs/releasing.md)."; exit 1; }
      - id: ephemeral
        name: sign SHA256SUMS with a throwaway key (dry run)
        if: needs.meta.outputs.real != 'true'
        run: |
          set -eu
          # Made here, used once, never stored or uploaded: a dry run never touches the release key.
          eph="$RUNNER_TEMP/ephemeral"
          mkdir -m 700 "$eph"
          pw=$(head -c 24 /dev/urandom | base64)
          echo "::add-mask::$pw"
          printf '%s\n%s\n' "$pw" "$pw" | minisign -G -p "$eph/yoda.pub" -s "$eph/yoda.key" > /dev/null
          printf '%s\n' "$pw" | minisign -S -s "$eph/yoda.key" -m "$DIST/SHA256SUMS" -t "yoda release $VERSION"
          rm -f "$eph/yoda.key"
          echo "pubkey=$(sed -n 2p "$eph/yoda.pub")" >> "$GITHUB_OUTPUT"
          pub=$(sed -n "s/^RELEASE_PUBKEY_EMBEDDED='\(.*\)'$/\1/p" ops/install/install.sh)
          case "$pub" in
            *REPLACE-WITH*) echo "::notice::install.sh still embeds the placeholder public key: a v* tag fails until the owner embeds the real one (docs/releasing.md)." ;;
          esac
      - name: verify end to end with install.sh
        env:
          # Empty on a real release: install.sh then verifies with the key it embeds, as every host will.
          YODA_RELEASE_PUBKEY: ${{ steps.ephemeral.outputs.pubkey }}
        run: |
          set -eu
          [ -n "$YODA_RELEASE_PUBKEY" ] || unset YODA_RELEASE_PUBKEY
          sh ops/install/check-release.sh "$VERSION" "$DIST" "$IMAGE_PREFIX"
          ls -l "$DIST"
          cat "$DIST/SHA256SUMS"
      - name: keep the signed bundle for the release job
        if: needs.meta.outputs.real == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            ${{ env.DIST }}/install.sh
            ${{ env.DIST }}/yoda-${{ env.VERSION }}.tar.gz
            ${{ env.DIST }}/SHA256SUMS
            ${{ env.DIST }}/SHA256SUMS.minisig
          if-no-files-found: error
          retention-days: 7

  images:
    needs: [meta, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # ghcr.io push, real releases only (push below is false on a dry run)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: core, file: apps/core/Dockerfile, context: . }
          - { name: portal, file: apps/portal/Dockerfile, context: . }
          - { name: runner, file: apps/runner/Dockerfile, context: . }
          - { name: backup, file: ops/backup/Dockerfile, context: ops/backup }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: QEMU (linux/arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to ghcr.io
        if: needs.meta.outputs.real == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ needs.meta.outputs.platforms }}
          push: ${{ needs.meta.outputs.real == 'true' }}
          tags: |
            ${{ needs.meta.outputs.prefix }}/${{ matrix.name }}:${{ needs.meta.outputs.version }}
            ${{ needs.meta.outputs.prefix }}/${{ matrix.name }}:${{ needs.meta.outputs.sha_tag }}
          # The source label links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=yoda-${{ matrix.name }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    if: needs.meta.outputs.real == 'true'
    needs: [meta, bundle, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: assets
      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh ops/install/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          # The asset names install.sh downloads (bundle.sh writes them).
          set -- assets/install.sh "assets/yoda-$VERSION.tar.gz" assets/SHA256SUMS assets/SHA256SUMS.minisig
          for f in "$@"; do [ -s "$f" ] || { echo "::error::$f is missing"; exit 1; }; done
          pre=''
          [ "$PRERELEASE" != true ] || pre=--prerelease
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Yoda $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" ${pre:+"$pre"} "$@"
