name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # full history
      - name: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect \
            --source /repo --config /repo/.gitleaks.toml --redact --verbose

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: yoda # CI-only throwaway database
          POSTGRES_PASSWORD: yoda-ci
          POSTGRES_DB: yoda_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yoda -d yoda_test" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://yoda:yoda-ci@localhost:5432/yoda_test
      TEST_STORAGE: memory
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      # The installer tests (ops-install.test.ts) need minisign and shellcheck; with CI set they fail without them.
      - name: installer test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign shellcheck
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test

  # The Reporter extension end to end (plan B12): the unpacked e2e build in Playwright's Chromium, against a stub Yoda
  # (apps/extension/e2e/stub-yoda.ts). Its unit tests run in the test job with the rest.
  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @yoda/extension exec playwright install --with-deps chromium
      - run: pnpm --filter @yoda/extension build:e2e && pnpm --filter @yoda/extension e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e
          path: |
            apps/extension/playwright-report/
            apps/extension/test-results/
          retention-days: 7

  build:
    if: github.event_name == 'push'
    needs: [secrets, test, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build-only: images are published by the release workflow (release.yml) on v* tags, never from here.
      - run: docker build -f apps/core/Dockerfile -t yoda/core .
      - run: docker build -f apps/portal/Dockerfile -t yoda/portal .
      - run: docker build -f apps/runner/Dockerfile -t yoda/runner .
      - run: docker build -f ops/backup/Dockerfile -t yoda/backup ops/backup
