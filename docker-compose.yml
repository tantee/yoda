# DEV ONLY: every credential in this file is a throwaway local default.
# Host ports are overridable (e.g. KEYCLOAK_PORT=18080) if the defaults are taken.
services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: yoda          # DEV ONLY
      POSTGRES_PASSWORD: yoda      # DEV ONLY
      POSTGRES_DB: yoda
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yoda -d yoda']
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.6
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:9000'
      - '127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001'
    environment:
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-yoda}                 # DEV ONLY
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-yoda-dev-rustfs}      # DEV ONLY
    volumes:
      - rustfsdata:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8080}:8080'
    environment:
      KEYCLOAK_ADMIN: admin          # DEV ONLY
      KEYCLOAK_ADMIN_PASSWORD: admin # DEV ONLY
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  # DEV ONLY: catches every email the core sends (SMTP on 1025, web UI on 8025); never used in production.
  mailpit:
    image: axllent/mailpit:v1.27.11
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  pgdata:
  rustfsdata:
