<!-- Shown until the app mounts (Keycloak sign-in and /api/me): the shell, never a blank page (proposal §7.1).
     Plain HTML before i18n loads: the text follows the saved language cookie (strings mirror shell.signingIn). -->
<div class="yl-shell" aria-busy="true">
  <div class="yl-rail"><div class="yl-brand"><span class="yl-mark">Y</span><span class="yl-name">Yoda</span></div><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="yl-main">
    <div class="yl-bar"></div>
    <div class="yl-status" role="status"><span class="yl-spin"></span><span id="yl-text">กำลังเข้าสู่ระบบ…</span></div>
  </div>
</div>
<script>
  if (/(?:^|;\s*)yoda_locale=en(?:;|$)/.test(document.cookie)) document.getElementById('yl-text').textContent = 'Signing in…'
</script>
